security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\Admin:
            algorithm: auto
        App\Entity\Student:
            algorithm: auto

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        admin_provider:
            entity:
                class: App\Entity\Admin
                property: email
        student_provider:
            entity:
                class: App\Entity\Student
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        
        # Student firewall
        student:
            pattern: ^/student
            lazy: true
            provider: student_provider
            form_login:
                login_path: student_login
                check_path: student_login
                default_target_path: student_dashboard
                enable_csrf: true
            logout:
                path: student_logout
                target: app_landing
                invalidate_session: true
        
        # Admin firewall
        admin:
            pattern: ^/admin
            lazy: true
            provider: admin_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin_dashboard
                enable_csrf: true
            logout:
                path: admin_logout
                target: app_landing
                invalidate_session: true
        
        # Main firewall for public pages
        main:
            lazy: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/register, roles: PUBLIC_ACCESS }
        - { path: ^/admin/profile, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/student/login, roles: PUBLIC_ACCESS }
        - { path: ^/student/register, roles: PUBLIC_ACCESS }
        - { path: ^/student, roles: ROLE_STUDENT }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
